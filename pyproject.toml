[project]
name = "oam-eoapi-stats"
version = "0.1.0"
description = "Lightweight statistics service for the OpenAerialMap eoAPI catalog"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Development Seed" }]
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.10,<4",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    "httpx2",
    "pre-commit",
    "pytest>=8",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 125

[tool.ruff.lint]
extend-select = ["I", "E", "F", "W"]
