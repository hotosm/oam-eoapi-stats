name: Python check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint_and_test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  build_image:
    name: Build image
    runs-on: ubuntu-latest
    needs: lint_and_test
    permissions:
      contents: read
      packages: write
    env:
      # Pull requests build only; pushes to main also publish `main` and `sha-<sha>`.
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/hotosm/oam-eoapi-stats
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/hotosm/oam-eoapi-stats
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration:
    name: Integration test (pgstac)
    runs-on: ubuntu-latest
    services:
      pgstac:
        image: ghcr.io/stac-utils/pgstac:v0.10.1
        env:
          POSTGRES_USER: username
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgis
          PGUSER: username
          PGPASSWORD: password
          PGDATABASE: postgis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "psql -tAc 'SELECT pgstac.get_version()'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      PGSTAC_TEST_DSN: postgresql://username:password@localhost:5432/postgis
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest tests/integration -v
