name: Publish release image

# Builds an existing release tag and pushes it to GHCR as `<version>` (and
# optionally `latest`). Called by release-please.yml when a release is cut, and
# runnable by hand to (re)publish an older tag, e.g. `oam-eoapi-stats-v0.1.0`.

on:
  workflow_call:
    inputs:
      tag:
        description: Git tag to build (e.g. oam-eoapi-stats-v0.1.0)
        type: string
        required: true
      latest:
        description: Also tag the image as `latest`
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build (e.g. oam-eoapi-stats-v0.1.0)
        type: string
        required: true
      latest:
        description: Also tag the image as `latest` (only for the newest release)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Derive version from tag
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^oam-eoapi-stats-v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            echo "::error::'$TAG' is not an oam-eoapi-stats-v<semver> tag"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Read sha/ref from the checked-out tag, not the triggering commit.
          context: git
          images: ghcr.io/hotosm/oam-eoapi-stats
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ inputs.latest }}
          labels: |
            org.opencontainers.image.source=https://github.com/hotosm/oam-eoapi-stats
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
